# Numerical Scoring Configuration
# This file defines the scoring rules for converting categorical classification results
# into numerical scores (0-100 point scale with potential -40 penalty)

# Field weights and maximum points
field_weights:
  classification_category: 40
  website_quality: 10
  full_list_of_services_offered: 20
  employee_count: 20
  find_contacts_at_company: 10
  # Total: 40+10+20+20+10 = 100 points max (before Install Only cap)

# Scoring rules for each field
scoring_rules:
  # Classification Category (40 points max)
  classification_category:
    "Maintenance & Service Only": 40 # Most valuable - stable recurring revenue
    "50/50 Split": 30 # Diversified revenue streams
    "Install Only": 0 # Project-based, cyclical business (capped at 50 total)
    "Other": 0 # Specialized expertise, niche market
    "Not Classifiable": 0 # Unknown business model, high risk

  # Website Quality (10 points max)
  website_quality:
    "High Quality": 10 # Professional operations, strong market presence
    "Average": 5 # Moderate investment, basic digital maturity
    "Poor": 0 # Low investment, potential resource constraints

  # Binary scoring for text fields - REMOVED for simplified scoring
  # The following fields are no longer scored but remain in output data:
  # - has_certifications_and_compliance_standards
  # - has_multiple_service_territories
  # - using_competitor_software
  # - part_of_known_fire_protection_association

  # Full List of Services Offered (20 points max)
  full_list_of_services_offered:
    "Fire Protection Only": 20 # Focused expertise, specialized market
    "Fire Protection and Other Services": 10 # Diversified but fire-focused
    "Other Services Only": 0 # Not primarily fire protection, no penalty

  # Employee Count Scoring (20 points max)
  employee_count_scoring:
    blank_value: 0 # Blank/empty/no people found = 0 points
    range_0_10: 0 # 0-10 employees = 0 points
    range_11_50: 10 # 11-50 employees = 10 points
    range_51_plus: 20 # 51+ employees = 20 points

  # Find Contacts Scoring (10 points max) - Tiered system
  find_contacts_scoring:
    no_contacts: 0 # Blank/"no profile found"/"company not found" = 0 points
    one_contact: 5 # "Found 1 People" = 5 points
    multiple_contacts: 10 # "Found 2+ People" = 10 points

# Penalty system - REMOVED for simplified scoring
# The parent company penalty has been removed to focus on core business metrics

# Score validation
validation:
  min_score: 0 # Minimum possible score (no penalties)
  max_score: 100 # Maximum possible score
  base_max_score: 100 # Maximum before Install Only cap applied
  install_only_cap: 40 # Install Only firms capped at 40 points regardless of raw score

# Field mapping for missing fields in data models
# This section maps the actual field names used in code to config keys
field_mapping:
  # Active scoring fields
  classification_category: "classification_category"
  website_quality: "website_quality"
  full_list_of_services_offered: "full_list_of_services_offered"
  employee_count: "employee_count"
  find_contacts_at_company: "find_contacts_at_company"

  # Fields removed from scoring but kept in output data:
  # - has_certifications_and_compliance_standards
  # - has_multiple_service_territories
  # - has_parent_company
  # - using_competitor_software
  # - part_of_known_fire_protection_association
